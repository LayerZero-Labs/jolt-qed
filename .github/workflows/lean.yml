name: lean

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep this job name stable: the proposed main rules require `build`.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Sail guard compares the PR's base and head commits, so both
          # commits must be available to git rather than using a shallow clone.
          fetch-depth: 0
      # LeanRV64D is generated Sail output and is treated as trusted input.
      # Reject additions, edits, deletions, and renames affecting either the
      # root module or anything below LeanRV64D/ before attempting the build.
      # This checks PRs; the main rules must enforce it and disallow direct pushes.
      - name: Protect generated Sail sources
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- LeanRV64D.lean LeanRV64D/; then
            echo "::error::Generated Sail sources are trusted and must not be changed."
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- LeanRV64D.lean LeanRV64D/
            exit 1
          fi
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build: true
          # The composite action's GitHub cache steps use floating action tags.
          # Keep those steps disabled; Mathlib's dependency cache remains enabled.
          use-github-cache: false
