name: lean

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep this job name stable: the proposed main rules require `build`.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Sail guard compares the PR's base and head commits, so both
          # commits must be available to git rather than using a shallow clone.
          fetch-depth: 0
      # LeanRV64D is generated Sail output and is treated as trusted input.
      # A PR may change it only by regenerating it from the pinned inputs in
      # sail-import/PROVENANCE.toml. When a PR touches the root module, anything
      # below LeanRV64D/, the pinned inputs, the scripts that use them, the
      # Lean copy of the memory regions (WholeRun/Relation.lean), or the Lake
      # files that pin the Lean Sail runtime and the toolchain (lakefile.toml,
      # lake-manifest.json, lean-toolchain), CI rebuilds the pinned Sail
      # compiler, regenerates the model and requires the checked-in tree to be
      # byte-for-byte identical.
      # This checks PRs; the main rules must enforce it and disallow direct pushes.
      # The next step runs the checks that need no build on every run.
      - name: Protect generated Sail sources
        id: sail
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- LeanRV64D.lean LeanRV64D/ \
              sail-import/ scripts/regen-sail-model.sh scripts/check-sail-model.sh \
              JoltConstraints/theorems/WholeRun/Relation.lean \
              lakefile.toml lake-manifest.json lean-toolchain; then
            echo "regenerate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- LeanRV64D/LICENSE; then
            echo "::error::LeanRV64D/LICENSE is not generated and must not be changed."
            exit 1
          fi
          echo "Generated Sail sources or their pinned inputs changed:"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- LeanRV64D.lean LeanRV64D/ \
            sail-import/ scripts/regen-sail-model.sh scripts/check-sail-model.sh \
            JoltConstraints/theorems/WholeRun/Relation.lean \
            lakefile.toml lake-manifest.json lean-toolchain | head -50
          echo "regenerate=true" >> "$GITHUB_OUTPUT"
      # The Lean Sail runtime in lakefile.toml and lake-manifest.json must be
      # [runtime] in PROVENANCE.toml, and the tree, input and memory-region
      # digests must match, whether or not the PR touches them.
      - name: Check the pinned Sail inputs
        run: scripts/check-sail-model.sh --inputs-only
      - name: Install the Sail compiler's build dependencies
        if: steps.sail.outputs.regenerate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opam ocaml z3 libgmp-dev pkg-config m4
          opam init -y --bare --disable-sandboxing
          opam switch create sail ocaml-system
      - name: Regenerate the Sail model and compare
        if: steps.sail.outputs.regenerate == 'true'
        env:
          OPAMSWITCH: sail
        run: scripts/check-sail-model.sh "$RUNNER_TEMP/sail-check"
      # Cache the build of the generated Sail model, which takes about 23 of the
      # build's 79 CPU-minutes on main. The key covers every input of that build.
      # Lake still checks each restored module's trace against its inputs and
      # rebuilds any module whose source, imports, toolchain or options differ.
      # GitHub scopes a cache saved by a PR run to that PR; only pushes to main
      # save caches that every PR can read.
      - name: Restore the LeanRV64D build
        id: leanrv64d-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build/lib/lean/LeanRV64D.*
            .lake/build/lib/lean/LeanRV64D/
            .lake/build/ir/LeanRV64D.*
            .lake/build/ir/LeanRV64D/
          key: leanrv64d-${{ runner.os }}-${{ hashFiles('LeanRV64D.lean', 'LeanRV64D/**', 'lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      # assumptions.toml lists every premise, sorry and image field the
      # headline theorems depend on (reports/2026-11-25-stale-assumptions.md).
      # The script fails when a sorry, a field of Rv64ProgramImage or a binder
      # listed in JoltConstraints/Audit/Premises.lean has no registry entry, when
      # an entry is stale, or when a bug-report header is missing.
      - name: Check the assumption registry
        run: python3 scripts/check-assumptions.py
      # The build checks the axioms of the audited theorems (#audit_statements in
      # JoltConstraints/Audit/Statements.lean). This step rejects the mechanisms
      # anywhere in the source: sorry, sorryAx, admit, unlisted axioms,
      # native_decide, bv_decide, decide +kernel, maxHeartbeats, synthInstance
      # options, respectTransparency false, and maxRecDepth outside the five
      # generated Sail options in scripts/lean-policy-allowlist.toml. The tests
      # in scripts/tests/ check that the scanner rejects known bypasses.
      - name: Check the Lean source policy
        run: |
          python3 scripts/check-lean-policy.py
          python3 -m unittest discover -s scripts/tests -v
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          build: true
          # The composite action's GitHub cache steps use floating action tags.
          # Keep those steps disabled; Mathlib's dependency cache remains enabled.
          use-github-cache: false
      # Save the LeanRV64D build even when a later proof fails, but only once
      # every LeanRV64D module is up to date, so a partial build is never saved
      # under a key that later runs would hit without completing it.
      - name: Check that the LeanRV64D build is complete
        id: leanrv64d-complete
        if: ${{ !cancelled() && steps.leanrv64d-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: lake build LeanRV64D --no-build
      - name: Save the LeanRV64D build
        if: ${{ !cancelled() && steps.leanrv64d-complete.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build/lib/lean/LeanRV64D.*
            .lake/build/lib/lean/LeanRV64D/
            .lake/build/ir/LeanRV64D.*
            .lake/build/ir/LeanRV64D/
          key: ${{ steps.leanrv64d-cache.outputs.cache-primary-key }}
