# Baseline of the hygiene scan (scripts/check_hygiene.py).
#
# Each entry records a file, a token and the exact number of occurrences the
# scan finds today, outside comments and strings. The scan fails on any
# occurrence not recorded here and on any entry whose count no longer matches,
# so this file can only shrink as the debt is paid. JoltTests/ has no entries:
# it is zero tolerance. JoltBytecode/ is zero tolerance except for [[ethlib]].
#
# [[ethlib]]: JoltBytecode/Inlines/ hash specifications copied unchanged from
# ethereum/EthLib 5310b3ec007b05a2bfe33b01125392b07df5f636, which
# scripts/check-ethlib-copies.sh (the ethlib-copies job) checks. EthLib proves
# their constants with `decide +kernel`: twice each in the SHA-256 and BLAKE2b
# files, five times in the Keccak file. AGENTS.md allows `decide +kernel` when
# its kernel check is fast (commit 91d2680). It adds no axiom. The section may
# record only `decide +kernel`, and only under JoltBytecode/Inlines/.
#
# [[known]]: JoltConstraints/ debt.
# - Five completeness gaps (JoltConstraints/model_review.md, "Proofs owed"):
#   (01), (08) and (11) wait on a16z/jolt#1949, (37) on #1950, (38) on #1951
#   item 1. None is in the closure of the soundness or whole-run theorems.
# - decide +kernel in Soundness/Layer5/DeviceMemoryObstruction.lean
#   ("Existing tactic debt"); only the root module imports it.
# model_review.md records no bv_decide use and no raised limit in
# JoltConstraints/ today, and the scan agrees.
#
# [[generated]]: LeanRV64D/, generated from the inputs pinned in
# sail-import/PROVENANCE.toml.
# - Declaration-local maxRecDepth and maxHeartbeats options on seven generated
#   declarations; docs/riscv-alignment.md section 8 lists each one and whether
#   it is in the closure of JoltInstance.sail_soundness.
# - The 67 floating-point axioms of the handwritten RiscvExtras.lean
#   (riscv_f16Add and the rest), which section 8 records as not reached.
#   get_16_random_bits is an opaque constant, not an axiom, and the scan does
#   not count it. JoltAudit.Axioms checks that no headline theorem depends on
#   an axiom other than propext, Classical.choice and Quot.sound.
# - Nine plain string literals in DeviceTree.lean (the device-tree text, with
#   unbalanced `{`) whose end would differ if Lean read them as interpolated.
#   Lean reads them as plain strings, which is also how the scan continues.

