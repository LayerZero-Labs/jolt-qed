# Exceptions to scripts/check-lean-policy.py. Each one names what it allows exactly and why.
# The script fails on anything else, and on an entry that no longer matches the source.

# The floating-point primitives of the Sail model. RiscvExtras.lean is copied from
# sail-riscv's handwritten support (scripts/regen-sail-model.sh, patched by
# sail-import/patches/sail-riscv-jolt-hart.patch); the Sail Lean runtime has no softfloat
# implementation, so it declares them as axioms. Jolt's hart has no F or D extension
# (sail-import/rv64d_jolt.json turns floating point off), and `#audit_statements` in
# JoltConstraints/Audit/Statements.lean checks that no headline theorem, necessity witness or
# derived fact depends on any of them.
[[axioms]]
file = "LeanRV64D/RiscvExtras.lean"
names = [
  "riscv_f16Add", "riscv_f16Sub", "riscv_f16Mul", "riscv_f16Div", "riscv_f32Add",
  "riscv_f32Sub", "riscv_f32Mul", "riscv_f32Div", "riscv_f64Add", "riscv_f64Sub",
  "riscv_f64Mul", "riscv_f64Div", "riscv_f16MulAdd", "riscv_f32MulAdd", "riscv_f64MulAdd",
  "riscv_f16Sqrt", "riscv_f32Sqrt", "riscv_f64Sqrt", "riscv_f16ToI32", "riscv_f16ToUi32",
  "riscv_i32ToF16", "riscv_ui32ToF16", "riscv_f16ToI64", "riscv_f16ToUi64", "riscv_i64ToF16",
  "riscv_ui64ToF16", "riscv_f32ToI32", "riscv_f32ToUi32", "riscv_i32ToF32", "riscv_ui32ToF32",
  "riscv_f32ToI64", "riscv_f32ToUi64", "riscv_i64ToF32", "riscv_ui64ToF32", "riscv_f64ToI32",
  "riscv_f64ToUi32", "riscv_i32ToF64", "riscv_ui32ToF64", "riscv_f64ToI64", "riscv_f64ToUi64",
  "riscv_i64ToF64", "riscv_ui64ToF64", "riscv_f16ToF32", "riscv_f16ToF64", "riscv_f32ToF64",
  "riscv_f32ToF16", "riscv_f64ToF16", "riscv_f64ToF32", "riscv_f32ToBF16", "riscv_f16Lt",
  "riscv_f16Lt_quiet", "riscv_f16Le", "riscv_f16Le_quiet", "riscv_f16Eq", "riscv_f32Lt",
  "riscv_f32Lt_quiet", "riscv_f32Le", "riscv_f32Le_quiet", "riscv_f32Eq", "riscv_f64Lt",
  "riscv_f64Lt_quiet", "riscv_f64Le", "riscv_f64Le_quiet", "riscv_f64Eq",
  "riscv_f16roundToInt", "riscv_f32roundToInt", "riscv_f64roundToInt",
]

# The five per-declaration limits of the generated Sail model. scripts/regen-sail-model.sh
# (step b) inserts each one directly before a generated if-chain or decoder mapping that
# exceeds Lean's default maxRecDepth, and sail-import/PROVENANCE.toml pins the result
# (tree_sha256). Each entry is the option line and the definition it applies to.
[[options]]
file = "LeanRV64D/SysControl.lean"
option = "maxRecDepth 750"
declaration = "is_CSR_accessible"

[[options]]
file = "LeanRV64D/ZicsrInsts.lean"
option = "maxRecDepth 700"
declaration = "read_CSR"

[[options]]
file = "LeanRV64D/ZicsrInsts.lean"
option = "maxRecDepth 800"
declaration = "write_CSR"

[[options]]
file = "LeanRV64D/InstsEnd.lean"
option = "maxRecDepth 750"
declaration = "encdec_backwards"

[[options]]
file = "LeanRV64D/InstsEnd.lean"
option = "maxRecDepth 750"
declaration = "encdec_backwards_matches"
