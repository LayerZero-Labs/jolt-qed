name = "JoltBytecode"
defaultTargets = ["JoltBytecode", "JoltConstraints"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "Sail"
git = "https://github.com/rems-project/lean-sail"
rev = "v8"

[[lean_lib]]
name = "JoltBytecode"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

[[lean_lib]]
name = "JoltConstraints"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

# Trusted generated layer: not a default target. Lake rebuilds imported modules
# only when its source, toolchain, or build configuration changes.
[[lean_lib]]
name = "LeanRV64D"
leanOptions.weak.linter.style.nameCheck = false
moreLeancArgs = ["-fbracket-depth=500"]

# Tests: not a default target. `lake build JoltTests.InlineKat.Vectors` and
# `lake exe inline-kat CASES.json` (see scripts/inline-kat/build.sh).
[[lean_lib]]
name = "JoltTests"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

[[lean_exe]]
name = "inline-kat"
root = "JoltTests.InlineKat.Main"
