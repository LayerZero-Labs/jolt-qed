name = "JoltBytecode"
defaultTargets = ["JoltBytecode", "JoltConstraints"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "Sail"
git = "https://github.com/rems-project/lean-sail"
rev = "v8"

[[lean_lib]]
name = "JoltBytecode"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

[[lean_lib]]
name = "JoltConstraints"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

# Trusted generated layer: not a default target. Lake rebuilds imported modules
# only when its source, toolchain, or build configuration changes.
[[lean_lib]]
name = "LeanRV64D"
leanOptions.weak.linter.style.nameCheck = false
moreLeancArgs = ["-fbracket-depth=500"]

# Tests: not a default target.
# The expansion-parity comparator runs through
# `lake env lean JoltTests/ExpansionParity/Run.lean` rather than a `lean_exe`:
# `LeanRV64D.lean` declares a root `main`, which every executable importing the
# model would inherit.
[[lean_lib]]
name = "JoltTests"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

# Axiom allowlist for the headline theorems: not a default target.
# `lake build JoltAudit` fails if a theorem gated in JoltAudit/Axioms.lean
# depends on an axiom other than propext, Classical.choice and Quot.sound.
[[lean_lib]]
name = "JoltAudit"
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

# Comparator gate (ci/comparator/README.md): not default targets.
# `lake comparator --config ci/comparator/config.json` builds these two modules
# in its sandbox, which exposes only this package directory, so the gate lives
# in the root package rather than in a package of its own. Challenge.lean ends
# its frozen statements in `sorry` on purpose; ci/ is outside the roots of
# scripts/check_hygiene.py.
[[lean_lib]]
name = "Challenge"
srcDir = "ci/comparator"

[[lean_lib]]
name = "Solution"
srcDir = "ci/comparator"
