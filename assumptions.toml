  "JoltInstance.sail_soundness (hdecoded)",
]
anchors = [
  "crates/jolt-program/src/image/elf.rs (decode_elf)",
  "crates/jolt-program/src/image/elf.rs (decode_text_section)",
  "crates/jolt-program/src/image/elf.rs (merge_ranges)",
  "crates/jolt-program/src/preprocess/ram.rs (code_region)",
  "crates/jolt-program/src/image/decode.rs (decode_instruction)",
