# Registry of the premises of jolt-qed's headline theorems.
#
# Every binder of the headline theorems, every field of `Rv64ProgramImage` and of
# `WholeRun.BlockConforms`, every `sorry` in JoltConstraints/ and JoltBytecode/, and the
# scope premises have an entry here. reports/2026-11-25-stale-assumptions.md explains why.
#
# Checks:
# - The build checks the binder and field lists in JoltConstraints/Audit/Premises.lean.
# - scripts/check-assumptions.py checks that this file agrees with those lists, with the
#   `sorry`s in the source, with the fields of `Rv64ProgramImage`, with the necessity
#   witnesses, and with the headers of bug-report/*/README.md.
# - .github/workflows/jolt-main-drift.yml compares every anchor file at the pin with Jolt
#   main each night and lists the entries whose anchor files changed.
#
# Fields of an entry:
#   name               a short, unique name; bug-report headers refer to entries by it.
#   lean               the Lean declaration, field or expression.
#   kind               premise:     an assumption the model does not prove;
#                      scope:       excludes a part of Jolt the proofs do not cover yet;
#                      field:       a premise on the field F;
#                      image-field: a proof field of Rv64ProgramImage, a fact every instance carries;
#                      sorry:       an unproved lemma;
#                      statement:   what the theorem is about (the constraints accept, the
#                                   instance is in Jolt's language, Jolt's prover accepts);
#                      data:        an ordinary quantified object.
#   appears_in         where it is a binder or field: "<theorem or structure> (<name>)",
#                      exactly as in JoltConstraints/Audit/Premises.lean.
#   file               for a sorry: the file that holds it.
#   anchors            Jolt functions it depends on: "<path> (<fn>)" at `jolt_rev`.
#   witness            a necessity witness (JoltConstraints/Audit/Necessity.lean).
#   derived_by         a theorem that proves the fact from another premise.
#   no_witness_reason  why it has no witness. Every entry other than `data` has a witness
#                      or this reason.
#   upstream           the upstream issue, if any.
#   bug_report         the bug-report folder or file, if any.

jolt_rev = "ff6fc656813d950565c9f6e1258b78bdaf0e60e8"

