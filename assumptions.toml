# Registry of the premises of jolt-qed's headline theorems.
#
# Every binder of the headline theorems, every field of `Rv64ProgramImage` and of
# `WholeRun.BlockConforms`, every `sorry` in JoltConstraints/ and JoltBytecode/, and the
# scope premises have an entry here. reports/2026-11-25-stale-assumptions.md explains why.
#
# Checks:
# - The build checks the binder and field lists in JoltConstraints/Audit/Premises.lean.
# - scripts/check-assumptions.py checks that this file agrees with those lists, with the
#   `sorry`s in the source, with the fields of `Rv64ProgramImage`, with the necessity
#   witnesses, and with the headers of bug-report/*/README.md.
# - .github/workflows/jolt-main-drift.yml compares every anchor file at the pin with Jolt
#   main each night and lists the entries whose anchor files changed.
#
# Fields of an entry:
#   name               a short, unique name; bug-report headers refer to entries by it.
#   lean               the Lean declaration, field or expression.
#   kind               premise:     an assumption the model does not prove;
#                      scope:       excludes a part of Jolt the proofs do not cover yet;
#                      correspondence: a place where the model is a transcription of Jolt's
#                                   code that no theorem compares with that code, and where
#                                   the two are known to differ or are not shown to agree;
#                                   the headline theorems are about the model;
#                      field:       a premise on the field F;
#                      image-field: a proof field of Rv64ProgramImage, a fact every instance carries;
#                      derived:     a former premise that is now a theorem; the entry keeps
#                                   the Jolt functions its proof depends on watched;
#                      sorry:       an unproved lemma;
#                      statement:   what the theorem is about (the constraints accept, the
#                                   instance is in Jolt's language, Jolt's prover accepts);
#                      data:        an ordinary quantified object.
#   appears_in         where it is a binder or field: "<theorem or structure> (<name>)",
#                      exactly as in JoltConstraints/Audit/Premises.lean. Entries that are not
#                      binders or fields (correspondence, derived, some scope) have none.
#   file               for a sorry: the file that holds it.
#   anchors            Jolt functions it depends on: "<path> (<fn>)" at `jolt_rev`.
#   witness            a necessity witness (JoltConstraints/Audit/Necessity.lean).
#   witness_shows      what the witness proves, and what it does not; required with `witness`.
#                      A witness tests the premise at the boundary its theorem states; it
#                      shows the premise is needed for a headline theorem only when it builds
#                      an object that meets every other premise of that theorem.
#   derived_by         a theorem that proves the fact from another premise, or from nothing.
#                      Every witness and derived_by is a line of #audit_statements in
#                      JoltConstraints/Audit/Statements.lean, which checks that the name exists,
#                      its axioms, and its statement.
#   no_witness_reason  why it has no witness. Every entry other than `data` has a witness
#                      or this reason.
#   upstream           the upstream issue, if any.
#   bug_report         the bug-report folder or file, if any.

jolt_rev = "ff6fc656813d950565c9f6e1258b78bdaf0e60e8"

# ---------------------------------------------------------------------------
# Premises

[[entry]]
name = "JoltField"
lean = "JoltField"
kind = "field"
appears_in = [
  "JoltInstance.soundness (joltField)",
  "JoltInstance.sail_soundness (joltField)",
]
anchors = [
  "crates/jolt-algebra/src/algebra.rs (JoltField)",
  "crates/jolt-algebra/src/solinas/mod.rs (Prime128Offset6A23801F)",
  "crates/jolt-claims/src/protocols/composed/r1cs/rv64.rs (rv64_trace_constraints)",
]
witness = "JoltConstraints.Audit.joltField_not_implied"
witness_shows = """Only that `[Field F]` does not imply JoltField: ZMod 2 is a field that \
breaks it. It does not show that soundness needs the premise. JoltInstance.completeness_someWitness \
holds over every field, and no instance outside the language with a satisfying assignment of \
AllConstraints over ZMod 2 is built. If a later change made AllConstraints imply JoltField, the \
witness would keep building. Follow-up: an instance that is not InLanguage with a satisfying \
assignment over a small field, which needs a concrete program and constraint assignment."""
upstream = ""
bug_report = ""

[[entry]]
name = "DecodedFrom"
lean = "Rv64ProgramImage.DecodedFrom"
kind = "premise"
appears_in = [
  "WholeRun.HonestTrace.sail_reproduces (hdecoded)",
  "JoltInstance.sail_soundness (hdecoded)",
]
anchors = [
  "crates/jolt-program/src/image/elf.rs (decode_elf)",
  "crates/jolt-program/src/image/elf.rs (decode_text_section)",
  "crates/jolt-program/src/image/elf.rs (merge_ranges)",
  "crates/jolt-program/src/preprocess/ram.rs (code_region)",
  "crates/jolt-program/src/image/decode.rs (decode_instruction)",
]
no_witness_reason = """Trust boundary (a platform premise in docs/whole-run-theorem.md): it \
says that the program is what Jolt's decode_elf builds from the parsed ELF. No constraint \
can check it, and every program Jolt builds satisfies it, so no model object should break it."""
upstream = ""
bug_report = ""

[[entry]]
name = "BlockConforms.riscv"
lean = "WholeRun.BlockConforms.riscv"
kind = "scope"
appears_in = [
  "WholeRun.HonestTrace.sail_reproduces (hconf)",
  "WholeRun.BlockConforms (riscv)",
]
anchors = [
  "crates/jolt-program/src/image/decode.rs (decode_custom)",
  "crates/jolt-riscv/src/kind.rs (SourceInstruction)",
]
witness = "JoltConstraints.Audit.blockConformsRiscv_not_implied"
witness_shows = """Only that DecodedFrom admits a program with a row of one of Jolt's own \
instructions (AdviceLD), so DecodedFrom alone does not rule out such rows. It builds no trace: \
no HonestTrace, no halt, no accepted prover configuration, and no block of a HaltPrefix that \
breaks BlockConforms.riscv. If a later change made the other premises of sail_reproduces exclude \
such blocks, the witness would keep building. Follow-up: a HonestTrace of a decoded program whose \
HaltPrefix has a block with a `.jolt` row, which needs a concrete run of the program."""
upstream = ""
bug_report = ""

# ---------------------------------------------------------------------------
# Scope and correspondence: boundaries that are not binders. The theorems are about the
# model; these entries record where the model is known not to cover, or not shown to match,
# what Jolt runs.

[[entry]]
name = "DoryConfiguration"
lean = "JoltConstraints.ConstraintContext.traceLengthFloor"
kind = "scope"
anchors = [
  "crates/jolt-verifier/src/config.rs (MIN_PADDED_TRACE_LENGTH)",
  "crates/jolt-verifier/src/verifier.rs (validate_trace_length)",
  "crates/jolt-prover/src/config.rs (derive_from_dimensions)",
  "crates/jolt-prover/src/config.rs (one_hot_config)",
]
no_witness_reason = """Scope boundary, not a premise: the configuration model \
(JoltConstraints/translation/prover_config.lean, ConstraintContext) is Jolt's build without \
the `akita` feature. It pads traces to at least 256 cycles (MIN_PADDED_TRACE_LENGTH), where \
an Akita build pads to 4096 and always uses log_k_chunk = 4 in one_hot_config. The field \
inequalities and the constraint algebra cover Akita's field; trace sizing, one-hot chunking \
and acceptance are Dory-specific. Follow-up: parameterize ProverConfig and the witness \
construction by protocol mode."""
upstream = ""
bug_report = ""

[[entry]]
name = "TracerInitialization"
lean = "JoltInstance.initial_state"
kind = "correspondence"
anchors = [
  "crates/jolt-program/src/image/elf.rs (decode_elf)",
  "tracer/src/emulator/mod.rs (setup_program)",
  "tracer/src/emulator/mod.rs (tohost_address)",
  "tracer/src/emulator/mod.rs (TEST_MEMORY_CAPACITY)",
  "tracer/src/lib.rs (create_emulator)",
  "common/src/jolt_device.rs (try_with_io)",
]
no_witness_reason = """Correspondence gap: the model initializes RAM from decode_elf's \
memory_init (every section at or above RAM_START_ADDRESS), while Jolt's tracer \
(setup_program) loads only sections of type 1, 14, 15 and 16 with a positive file offset \
and size, and caps memory at TEST_MEMORY_CAPACITY when the ELF has a nonzero `tohost` \
symbol. An allocated readable section of another type (for example a NOTE section) \
initializes model memory but not tracer memory. ElfSections records no section type, file \
offset or symbols, so DecodedFrom cannot state agreement, and no Lean object can witness \
the difference. Follow-up: model setup_program and prove agreement with initial_state on a \
defined ELF subset, or expose an initialization-agreement premise."""
upstream = ""
bug_report = ""

[[entry]]
name = "HostAllocation"
lean = "JoltISA.readHostBytes"
kind = "correspondence"
anchors = [
  "tracer/src/emulator/host_io.rs (read_host_bytes)",
  "tracer/src/emulator/cpu.rs (handle_advice_write)",
]
no_witness_reason = """Correspondence gap: the model assumes host allocation succeeds \
(JoltBytecode/JoltISA/HostIO.lean). Jolt's read_host_bytes returns an Allocation error when \
`try_reserve` fails, and handle_advice_write then logs it and appends nothing to the advice \
tape. Allocation depends on the host machine, not on the guest, so no Lean object can \
witness it."""
upstream = ""
bug_report = ""

