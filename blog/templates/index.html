{% extends "base.html" %}

{% block content %}
  <h1>{{ config.title }}</h1>
  <p>{{ config.description }}</p>
  {% set blog = get_section(path="blog/_index.md") %}
  <h2>Posts</h2>
  <ul>
    {% for post in blog.pages %}
      <li><a href="{{ post.permalink }}">{{ post.title }}</a></li>
    {% endfor %}
  </ul>
{% endblock content %}
