# Provenance of the trusted generated model LeanRV64D/.
#
# Regenerate with:
#   scripts/regen-sail-model.sh SAIL_BIN SAIL_RISCV_DIR OUT_DIR <modules below>
# then copy OUT_DIR/Lean_RV64D/LeanRV64D/ and LeanRV64D.lean over the tree.
# scripts/check-sail-model.sh WORK_DIR rebuilds everything below from these pins
# and checks that the checked-in tree is identical; CI runs it on every PR that
# changes the model or these inputs.

[model]
repository = "https://github.com/abiswas3/sail-riscv"
commit = "266473f8b2872ac25f5cfaf5a4293d6421a40b5d"
project_file_sha256 = "818fc3305955e3664b7a642d1899004ebb7960f54021db79538a68173a67adfa"
# Handwritten support adapted to the namespaced Lean backend and Lean 4.35, as
# upstream did in riscv/sail-riscv#1776, #1876 (open the model namespace) and
# #1667 (`toCtorIdx` -> `ctorIdx`). Apply before generating.
# Then the Jolt hart patch (docs/riscv-alignment.md):
#  - LR/SC reservations as model registers (model/sys/sys_reservation.sail)
#    instead of uninterpreted platform functions, with the options
#    platform.reservation.{require_exact_reservation_addr, invalidate_on_xret}
#    of upstream sail-riscv and a new require_width_within (an SC must be no
#    wider than its LR); MRET and SRET cancel the reservation when
#    invalidate_on_xret is set; cancelling clears the address and width too,
#    so "no reservation" has one representation;
#  - the mstatus.FS legal-values policy base.mstatus.fs_legal_states, backported
#    from upstream sail-riscv 81184531;
#  - mstatus.MPP resets to M on a hart without U-mode (it reset to 0, an
#    unsupported mode);
#  - the configuration check of memory regions passes its Ziccamoa and Ziccamoc
#    flags in the right order (upstream has since rewritten it);
#  - RiscvExtras.lean: no HTIF console, no experimental extensions; the
#    reservation axioms are gone.
patches = [
  "sail-import/patches/sail-riscv-lean-handwritten.patch",
  "sail-import/patches/sail-riscv-jolt-hart.patch",
]
patch_sha256 = [
  "095a3d4b82574d45735622339bcf6674e0d58c8975c04634c983876ec8d3b767",
  "705ddf4527ee5c500bb42aecef9ee58069be4b43cebd25c1a9b77b3cef7da485",
]

[compiler]
repository = "https://github.com/rems-project/sail"
commit = "2ae2199f8890180a8f9653f6ea08e54cd9790220"
version = "0.20.3"
# Lean backend fix for type-level `if` and `/` precedence (rems-project/sail#1774).
# Without it `flen` is generated as `if true then 8 else 4 * 8` = 8 instead of 64.
patches = ["sail-import/patches/1774-type-arithmetic.patch"]
patch_sha256 = ["a00368bdc758e9073b7ab08e0d70dc41b815f15d7fcfe9fdc9e501637d09b1a2"]

[runtime]
repository = "https://github.com/rems-project/lean-sail"
tag = "v8"
commit = "1e5b216bf881ef08da160db63b44ecda430802d6"

[config]
# Upstream config/config.json.in instantiated for RV64D, VLEN 256, ELEN 64.
upstream = "sail-import/rv64d_v256_e64.json"
upstream_sha256 = "a390a2f46fc02cf666bc9d0b8b0d7223444c1b5b473de406a8784548b191f753"
# Used for generation: Jolt's hart, RV64IMAC with Zca and Zicsr, M-mode only,
# no PMP, no virtual memory, no floating point, CLINT + I/O + RAM regions, and
# exact-address, width-contained LR/SC. Its header comment and
# docs/riscv-alignment.md give the reasons.
used = "sail-import/rv64d_jolt.json"
used_sha256 = "a60717fcf321459be8736a5e5f481dac2eed9ce864ff2d0e4253f1ad0a0b3992"

[modules]
# Lean 4.35 compiles inductive types eagerly and rejects one with more than 244
# constructors carrying data; the full instruction union has 353. The vector and
# F/D instruction modules (and the modules that require them) are left out,
# leaving 159 constructors. No hand-written proof refers to a dropped
# constructor. The Sail decoder modules stay in the selection because
# `Decode.joltDecode_agrees` and `Decode.joltDecode_compressed_agrees` use
# `ext_decode` and `ext_decode_compressed`.
excluded_roots = ["V_instructions", "FD_instructions"]
dropped_leaves = [
  "FD_instructions", "V_instructions", "Zfbfmin", "Zvabd_insts", "Zvbb", "Zvbc",
  "Zvfbfmin", "Zvfbfwma", "Zvkg", "Zvkned", "Zvknhab", "Zvksed", "Zvksh",
  "bfloat16_core",
]
selected = [
  "A_types", "B_types", "CFI_types", "FD_core", "H", "I_insts", "I_types",
  "K_core", "M_insts", "M_types", "Smcntrpmf", "Sscofpmf", "Ssqosid", "Sstc",
  "Stateen_csrs", "Stateen_regs", "Svinval", "V_core", "V_types", "Zaamo",
  "Zalrsc", "Zawrs_insts", "Zawrs_types", "Zba", "Zbb", "Zbc", "Zbkb", "Zbkx",
  "Zbs", "Zca", "Zcb", "Zcmop", "Zibi_insts", "Zibi_types", "Zicbom_insts",
  "Zicbom_types", "Zicbop_insts", "Zicbop_types", "Zicboz", "Zicfilp_insts",
  "Zicfilp_regs", "Zicfiss_insts", "Zicfiss_regs", "Zicntr", "Zicond_insts",
  "Zicond_types", "Zicsr_insts", "Zicsr_types", "Zifencei", "Zihintntl_insts",
  "Zihintntl_types", "Zihintpause", "Zihpm", "Zimop", "Zkn", "Zkr", "Zks",
  "Zvabd_types", "Zvk_core", "core", "exceptions", "main", "pmp", "postlude",
  "prelude", "rmem", "sys", "unit_tests",
]

[output]
# sha256 over the sorted list of `shasum -a 256` lines for LeanRV64D/**/*.lean
# followed by LeanRV64D.lean.
tree_sha256 = "74041ff8565d6f9a3fe3ecaf2abdd7fa212c9f78c9d4d1c4a9f77db159f9d4d2"
