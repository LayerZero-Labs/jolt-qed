# Provenance manifest: which Jolt code each Lean file models.
#
# [jolt] records the one Jolt revision the project is checked against.
# Each [[file]] entry names a Lean file under JoltBytecode/ or JoltConstraints/,
# the Jolt files it transcribes or relies on (models), the full Jolt revision it
# was last checked against (checked), and a note where its citations disagree.
# A file with no Jolt counterpart has models = [] and no checked revision.
# models and checked were derived from each file's own citations: checked is
# the published a16z/jolt revision the file names most (the later commit on a
# tie), and models are the full Jolt paths it cites that exist at checked.
# Entries that cite Jolt paths but name no revision keep their models and have
# no checked revision; their note says so.
#
# [[other_revision]] lists commits of other repositories that the scanned docs
# cite, so that the revision check does not count them as Jolt revisions. A
# repository-qualified citation (a GitHub URL or owner/repo@rev) must name the
# pin or the file's checked revision for a Jolt repository, and an
# [[other_revision]] of that same repository otherwise.
# [[known]] is the baseline of existing violations: local paths, citations of
# Jolt forks, Jolt revisions other than the pin or a file's checked revision,
# and models paths with no checked revision. scripts/check-provenance.py fails on any new violation and on any
# baseline count that no longer matches, so the baseline only shrinks.
# Each entry quotes the whole offending citation (the local path, the fork URL
# or the revision), so replacing one baselined citation with another fails.
# An unchecked-model entry records a models path of an entry that names no
# checked revision; the check requires it to exist at the pin, and a new
# unchecked path fails until it is recorded here or gets a checked revision.
#
# Check: scripts/check-provenance.py [--jolt-dir <a16z/jolt clone>]
# (reports/2026-11-11-provenance.md).

[jolt]
repository = "a16z/jolt"
pin = "3cc6e7bd179900cfad6a052335c32ea1ef749536"
note = "The a16z/jolt#2384 head, the revision the expansion-parity, decoder-sweep, lookup-tables and constraint-generation jobs check. Moved on 2026-11-12 from 580084fcfad4788ebf48413a92dd640ca090c45f, an earlier head of the same pull request, when those jobs moved; every models path of an entry with no checked revision exists at both. 580084fcf replaced the earlier Track T pin a6b6dc7177ec5ea5a3c60bd5cea4409c07ca6dc5 (reports/2026-11-11-provenance.md, Decisions). README.md and methods/soundness.md still name c97e93004fbf804409f0374fe8457c8f1562ce71, the merge of a16z/jolt#2250, which methods/soundness.md records as the project pin since 2026-11-05."

